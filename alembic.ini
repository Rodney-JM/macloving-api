[alembic]
script_location = alembic

prepend_sys_path = .

sqlalchemy.url =

# Autogenerate comparison behaviour (PostgreSQL-specific tuning).
compare_type = True

# Sphinx/offline SQL output configuration (unused by default).
# version_path_separator = os

# Output template for `alembic revision` generated files.
# file_template = %%(rev)s_%%(slug)s

# Time zone used in migration timestamps.
# timezone =

# Maximum line length for rendered SQL when running in --sql mode.
# sqlalchemy.render_as_batch = False

[post_write_hooks]
# Optional hooks run after writing a revision file.
# Logging configuration read by env.py via fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
